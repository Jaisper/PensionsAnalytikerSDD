# Alt, den byggede side kører, låst til version og SHA-256 (feature 005, FR-004).
# scripts/byg_side.py henter filerne ved build og fejler ved enhver afvigelse.

[pyodide]
version = "0.27.7"
kerne_url = "https://github.com/pyodide/pyodide/releases/download/0.27.7/pyodide-core-0.27.7.tar.bz2"
kerne_sha256 = "9bc8f127db6c590b191b9aee754022cb41b1a36c7bac233776c11c5ecb541be8"
# Pakker fra Pyodides egen distribution. Afhængigheder og SHA-256 tages fra pyodide-lock.json i kernen.
pakke_url = "https://cdn.jsdelivr.net/pyodide/v0.27.7/full/"
pakker = ["cryptography"]  # pdfminer.six importerer den på modulniveau

