# Feature 005 (D7): test, byg den statiske side og udgiv den på GitHub Pages.
# Pull requests testes og bygges; kun main udgives.
name: Test og udgiv

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-og-byg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Installér
        run: uv sync --frozen
      - name: Tests (CPython)
        run: uv run pytest
      - name: Byg siden
        run: uv run python scripts/byg_side.py
      - name: Browser til tests
        run: uv run playwright install --with-deps chromium
      - name: Tests (browser og Pyodide)
        run: uv run pytest -m browser
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  udgiv:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test-og-byg
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.udgivelse.outputs.page_url }}
    steps:
      - id: udgivelse
        uses: actions/deploy-pages@v4
