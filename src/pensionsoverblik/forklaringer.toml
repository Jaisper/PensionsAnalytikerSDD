# Forklaringskataloget (feature 020, FR-002): tekst pr. emne på tre niveauer.
#
#   niveau1 — Kort fortalt: korte sætninger i du-form, ingen paragraffer (LIX under 35).
#   niveau2 — Sådan regner vi: trinene, fagudtryk forklaret.
#   niveau3 — For eksperter: lovhenvisninger, formler og modelvalg.
#
# Kun ord og pladsholdere i {krøllede parenteser}, aldrig satser eller beløb (Princip II). Tallene
# kommer fra kernen og regelregistret, når teksten vises. Registerposter og advarsler peger på et
# emne; en test kræver, at alle har et emne, og at alle inventarpunkter er dækket (FR-006).
# `kort` og `visninger` (020b) knytter emnet til et kort under "Hvad består beløbet af?" og til en
# visning med "Sådan læser du …". Ordlisten ([[ord]]) har de samme tre niveauer (FR-009).

inventar = [
  "Folkepensionsalder og opsat folkepension",
  "Folkepension: grundbeløb, pensionstillæg, indtægtsgrundlag, modregning, tillægsprocent",
  "Ældrecheck og mediecheck, likvid formue og formuegrænse",
  "ATP",
  "Ratepension, livsvarig pension, aldersopsparing og kapitalpension",
  "Indkomstskat: bund, mellem, top, toptop, kommune, kirke, personfradrag, skatteloft",
  "AM-bidrag",
  "Kapitalindkomst og bundfradrag",
  "Udjævning, fast beløb og buffer uden lån",
  "Opsparing uden for pension",
  "Frit depot og aktiesparekonto",
  "Hvor skal næste krone hen?",
  "Løn, stopalder og fradrag",
  "Usikkerhed og levetid",
  "Optimering",
  "Husstand og partner",
  "Afkast, inflation, satsregulering og realfaktor",
  "Fastpunkt-iterationer",
  "Afrunding og præcision",
  "PDF-aflæsning",
  "Dit år",
  "Præsentation: hovedtal, kort, graf, tidslinje, opsparingsgraf, faner, statusikoner og farver",
  "Nominelle beløb og dagens kroner, måned og år, alder og kalenderår",
  "Forbehold: information, ikke rådgivning",
]

[[emne]]
id = "fast_beloeb"
titel = "Det faste beløb"
inventar = ["Udjævning, fast beløb og buffer uden lån"]
registerposter = []
advarsler = ["BUFFER_SOM_OPSPARING"]
niveau1 = "Du kan bruge ca. {maaned} kr. om måneden fra {fra_alder} år. Det er efter skat. Det er i dagens kroner. Så er det lige meget værd hele livet. Beløbet stiger kun, når der kommer flere penge ind. Det lånes aldrig."
niveau2 = "Dine udbetalinger svinger fra år til år. Vi jævner dem ud: i år med meget sparer vi op, og i år med lidt bruger vi af opsparingen. Det faste beløb er det højeste beløb, der kan holdes hvert år, uden at opsparingen nogensinde går i minus. Når et stort beløb lander senere, kan beløbet først stige fra det år. Opsparingens afkast beskattes som kapitalindkomst, og skatten betales af opsparingen."
niveau3 = "Forbrugsudjævning med likviditetsbegrænsning, segment for segment: fra et år med opsparing B er niveauet c = min over k af (B + nutidsværdien af indbetalingerne til og med år k) / (nutidsværdien af en voksende annuitet til og med år k). Segmentet slutter i det k, der giver minimum, og opsparingen er der netop brugt op. Renten er pensionens afkast før PAL-skat. Niveauet vokser med inflationen. Hovedtallet er det laveste niveau i perioden, regnet om til dagens kroner og afrundet til hele hundrede kroner."

[[emne]]
id = "aar"
titel = "Dit år"
inventar = ["Dit år"]
registerposter = []
advarsler = []
niveau1 = "I {kalenderaar} er du {alder} år. Du får ca. {netto} kr. om måneden efter skat. Pengene kommer fra: {kilder}."
niveau2 = "Regnestykket viser hver indkomst før skat, skatten fordelt på typer og beløbet efter skat. Pensionstillægget vises før og efter modregning. Ældrechecken kræver, at din formue pr. 1. januar er under grænsen. Til sidst ser du, hvor meget der går til eller fra din opsparing for at holde det faste beløb."
niveau3 = "Indkomstskatten regnes af den samlede indkomst (personskatteloven) og fordeles på indkomsterne efter størrelse; fordelingen er kun til visning. Skat pr. type er efter personfradrag. Mellem-, top- og toptopskat rammer grundlaget over hver grænse, og nedslaget for skatteloftet (PSL § 19) trækkes fra. Ligningsmæssige fradrag nedsætter kun kommune- og kirkeskat. Sporingen viser de registerposter, året brugte."

[[emne]]
id = "folkepensionsalder"
titel = "Folkepensionsalder og opsat folkepension"
inventar = ["Folkepensionsalder og opsat folkepension"]
registerposter = ["fp.folkepensionsalder", "opsat.*"]
advarsler = ["750_TIMER", "OPSAT_ANDRE_FORMER"]
niveau1 = "Din alder for folkepension afhænger af, hvornår du er født. Du kan vente med at få den. Så bliver den større hver måned."
niveau2 = "Folkepensionsalderen står i loven for hver fødselsårgang. Udskyder du folkepensionen, får du et ventetillæg, der gør den større resten af livet. Det kræver, at du arbejder et vist antal timer om året, mens du venter."
niveau3 = "Lov om social pension § 1 a (folkepensionsalder pr. fødselsdato) og §§ 15 a–15 h (opsat pension). Ventetillægget er regnet som et livsvarigt tillæg med registrets middellevetid. Andre udbetalingsformer (tillæg i ti år eller engangsbeløb) er ikke regnet."

[[emne]]
id = "grundbeloeb"
kort = ["folkepension"]
titel = "Grundbeløb"
inventar = ["Folkepension: grundbeløb, pensionstillæg, indtægtsgrundlag, modregning, tillægsprocent"]
registerposter = ["fp.grundbeloeb"]
advarsler = []
niveau1 = "Grundbeløbet er den faste del af din folkepension. Alle får det samme. Det bliver ikke mindre af anden indkomst."
niveau2 = "Grundbeløbet udbetales fra folkepensionsalderen. Det er skattepligtigt. I det første år får du kun for de måneder, hvor du har folkepension."
niveau3 = "Lov om social pension § 12. Siden 2023 nedsættes grundbeløbet ikke af egen arbejdsindkomst (L 117). Satsen reguleres efter satsreguleringen (registret)."

[[emne]]
id = "pensionstillaeg"
kort = ["folkepension"]
titel = "Pensionstillæg"
inventar = ["Folkepension: grundbeløb, pensionstillæg, indtægtsgrundlag, modregning, tillægsprocent"]
registerposter = ["fp.tillaeg.*", "fp.partner_ikke_pensionist.*", "fp.fradrag_forhoejelse.*", "fp.indtaegtsgrundlag.*"]
advarsler = []
niveau1 = "Pensionstillægget er den del af folkepensionen, der afhænger af din anden indkomst. Har du meget anden indkomst, bliver det mindre. Din egen løn tæller ikke med."
niveau2 = "Vi lægger din anden indkomst sammen: private pensioner, ATP og kapitalindkomst. Det kaldes indtægtsgrundlaget. Over et fradrag trækkes en procentdel af det overskydende fra tillægget. Det kaldes modregning. Er du gift eller samlevende, tæller jeres samlede indkomst. Din partners løn tæller ikke med."
niveau3 = "Lov om social pension §§ 29–32 a. Indtægtsgrundlaget omfatter personlig indkomst, positiv kapitalindkomst og aktieindkomst ud over udbytte op til grænsen. Egen og partnerens arbejdsindkomst indgår ikke (§ 29, stk. 1, nr. 10; L 117). Er partneren ikke pensionist, ses der bort fra en del af partnerens indkomst (§ 32 a). Modregningen afrundes som i registret."

[[emne]]
id = "tillaegsprocent"
kort = ["checks"]
titel = "Tillægsprocent, ældrecheck og mediecheck"
inventar = ["Folkepension: grundbeløb, pensionstillæg, indtægtsgrundlag, modregning, tillægsprocent", "Ældrecheck og mediecheck, likvid formue og formuegrænse"]
registerposter = ["tp.*", "yd.aeldrecheck", "yd.aeldrecheck.minimum", "yd.mediecheck"]
advarsler = []
niveau1 = "Ældrechecken og mediechecken er ekstra penge en gang om året. Du får dem, hvis du har lav indkomst og lille formue. Jo mere indkomst du har, jo mindre får du."
niveau2 = "Din personlige tillægsprocent styrer checkene. Den er hundrede, hvis din anden indkomst er lav, og falder et point for hvert trin over grænsen. Din løn tæller kun med over et bundfradrag. Checkene gives fra året efter, at du får folkepension, fordi du skal have folkepension pr. 1. januar."
niveau3 = "Lov om social pension § 14 e (tillægsprocent), § 72 d (ældrecheck) og § 72 e (mediecheck). Ældrechecken er satsen gange tillægsprocenten og udbetales ikke under minimum. Egen arbejdsindkomst over bundfradraget indgår i tillægsprocentens grundlag."

[[emne]]
id = "formuegraense"
kort = ["checks"]
titel = "Formuegrænsen for ældrechecken"
inventar = ["Ældrecheck og mediecheck, likvid formue og formuegrænse"]
registerposter = ["yd.aeldrecheck.formuegraense"]
advarsler = []
niveau1 = "Har du for mange penge i banken den 1. januar, får du ikke ældrecheck det år. Din bolig og din pension tæller ikke med."
niveau2 = "Likvid formue er penge, du hurtigt kan bruge: bank, aktier, obligationer og aktiesparekonto. For et par tæller jeres samlede formue. Grænsen er hård: en krone over, og checken falder bort."
niveau3 = "Lov om social pension § 72 d, stk. 2. Formuen opgøres pr. 1. januar. Opsparingen i udjævningen, urørt opsparing og partnerens opsparing tæller med. Engangsbeløb udbetales i løbet af året og tæller først fra året efter."

[[emne]]
id = "atp"
kort = ["atp"]
titel = "ATP"
inventar = ["ATP"]
registerposter = ["atp.*"]
advarsler = ["ATP_SKOENNET"]
niveau1 = "ATP er en livslang pension. De fleste har betalt til den gennem arbejdet. Du får den fra din alder for folkepension."
niveau2 = "Vi bruger din ATP fra PensionsInfo. Har du ikke skrevet den, bruger vi ATP's gennemsnit. ATP er skattepligtig og tæller med i pensionstillæggets indtægtsgrundlag."
niveau3 = "ATP Livslang Pension udbetales fra folkepensionsalderen og påvirkes ikke af opsat folkepension. Beløbet reguleres med satsreguleringen. Uden oplyst beløb bruges registrets gennemsnit, og det markeres."

[[emne]]
id = "ratepension"
kort = ["ratepension"]
titel = "Ratepension"
inventar = ["Ratepension, livsvarig pension, aldersopsparing og kapitalpension"]
registerposter = ["ordning.ratepension.*"]
advarsler = ["RATEPENSION_LOFT"]
niveau1 = "En ratepension betales ud over et fast antal år. Beløbet stiger lidt hvert år. Det er fordi resten af pengene stadig giver afkast."
niveau2 = "Hvert år udbetales restværdien delt med antallet af år, der er tilbage. Udbetalingen beskattes som personlig indkomst og nedsætter pensionstillægget. Der er et loft over, hvor meget du kan indbetale om året."
niveau3 = "Pensionsbeskatningsloven § 11 A (rate = restværdi / resterende år) og § 18 (indbetalingsloft). Mindste og længste periode står i registret. Indbetalinger over loftet er regnet som indbetaling til livsvarig pension."

[[emne]]
id = "livsvarig"
kort = ["livsvarig"]
titel = "Livsvarig pension"
inventar = ["Ratepension, livsvarig pension, aldersopsparing og kapitalpension"]
registerposter = []
advarsler = []
niveau1 = "En livsvarig pension betales hver måned, så længe du lever. Beløbet er det samme hele livet."
niveau2 = "Vi regner beløbet ud fra din opsparing, afkastet og en antaget levetid. Pensionsselskabet fastsætter det rigtige beløb. Udbetalingen beskattes som personlig indkomst og nedsætter pensionstillægget."
niveau3 = "Annuitet over horisonten fra udbetalingsstart til den antagne levealder, dog mindst registrets minimum af år. Ændres planens slutning i et levetidsscenarie, ændres ydelsen ikke."

[[emne]]
id = "aldersopsparing"
kort = ["engangsbeloeb"]
titel = "Aldersopsparing"
inventar = ["Ratepension, livsvarig pension, aldersopsparing og kapitalpension"]
registerposter = ["ordning.aldersopsparing.*"]
advarsler = ["ALDERSOPSPARING_OVER_LOFT"]
niveau1 = "Din aldersopsparing får du som ét beløb. Du betaler ikke skat, når du får den. Den gør ikke dit pensionstillæg mindre."
niveau2 = "Du betaler skat, når du indbetaler, ikke når du får pengene. Indbetalingen har et lille loft, der er højere de sidste år før folkepensionsalderen. Beløbet indgår i det faste beløb eller udbetales direkte."
niveau3 = "Pensionsbeskatningsloven §§ 10 A og 16 (indbetalingsloft og forhøjet loft de sidste år før folkepensionsalderen). Udbetalingen er skattefri og indgår ikke i indtægtsgrundlaget."

[[emne]]
id = "kapitalpension"
kort = ["engangsbeloeb"]
titel = "Kapitalpension"
inventar = ["Ratepension, livsvarig pension, aldersopsparing og kapitalpension"]
registerposter = ["ordning.kapitalpension.*"]
advarsler = ["PORTIONER_KRAEVER_AFTALE", "OMLAEGNING_KRAEVER_OVERFOERSEL"]
niveau1 = "En kapitalpension udbetales som et samlet beløb. Staten tager en afgift. Den nedsætter ikke dit pensionstillæg. Du kan også få den i portioner."
niveau2 = "Af hver udbetaling betales en fast afgift. Er afgiften betalt tidligere, er udbetalingen fri. Du kan få pengene i portioner over flere år, eller lægge dem om til en ratepension eller livrente, før udbetalingen begynder. Så beskattes de som indkomst og nedsætter pensionstillægget."
niveau3 = "Pensionsbeskatningsloven § 26 (afgift og delvis udbetaling), § 41 (omlægning) og fristen for udbetaling efter pensionsudbetalingsalderen. Portioner regnes som ratepensionens formel af restværdien. Kapitalpension fra før 1980 er ikke modelleret."

[[emne]]
id = "udbetalingsalder"
titel = "Hvornår en ordning kan udbetales"
inventar = ["Ratepension, livsvarig pension, aldersopsparing og kapitalpension"]
registerposter = ["ordning.udbetalingsalder.*"]
advarsler = ["UDBETALING_FOER_LOVLIG_ALDER"]
niveau1 = "Du kan få din pension ud et par år før folkepension. Det kommer an på, hvornår du fik den."
niveau2 = "Ordninger oprettet efter et bestemt år har en udbetalingsalder, der følger folkepensionsalderen. Ældre ordninger har en fast alder. PensionsInfo oplyser ofte alderen direkte, og så bruger vi den."
niveau3 = "Pensionsbeskatningsloven § 1 A (pensionsudbetalingsalder). Kendes oprettelsesdatoen ikke, bruges den laveste mulige alder, og der advares."

[[emne]]
id = "indkomstskat"
titel = "Indkomstskat"
inventar = ["Indkomstskat: bund, mellem, top, toptop, kommune, kirke, personfradrag, skatteloft"]
registerposter = ["skat.bundskat", "skat.personfradrag"]
advarsler = []
niveau1 = "Du betaler skat til staten og din kommune. Er du medlem af folkekirken, betaler du også kirkeskat. En del af din indkomst er fri for skat."
niveau2 = "Bundskat, kommuneskat og kirkeskat er en procent af din indkomst. Personfradraget er den del, der er fri for skat. Vi regner skatten af hele din indkomst samlet."
niveau3 = "Personskatteloven §§ 6 (bundskat), 10 (personfradrag) og kommuneskatteloven. Kommune- og kirkeskat beregnes af den skattepligtige indkomst efter ligningsmæssige fradrag; bundskat af personlig indkomst og positiv kapitalindkomst. Personfradraget regnes pr. grundlag."

[[emne]]
id = "skattetrin"
titel = "Mellemskat, topskat og skatteloft"
inventar = ["Indkomstskat: bund, mellem, top, toptop, kommune, kirke, personfradrag, skatteloft"]
registerposter = ["skat.mellemskat.*", "skat.topskat.*", "skat.toptopskat.*", "skat.skatteloft.*"]
advarsler = ["MELLEMSKAT_INTERVAL"]
niveau1 = "Har du en høj indkomst, betaler du mere i skat af de sidste kroner. Der er et loft over, hvor høj skatten kan blive."
niveau2 = "Over hver grænse kommer et ekstra skattetrin: mellemskat, topskat og toptopskat. Skatteloftet sikrer, at den samlede sats ikke bliver højere end loftet. Kapitalindkomst under et bundfradrag rammes ikke af trinnene."
niveau3 = "Personskatteloven §§ 6 a, 7 og 7 a og det skrå skatteloft i § 19. Hvert trin rammer grundlaget over trinnets grænse. Nedslaget for skatteloftet beregnes pr. bånd og separat for kapitalindkomst."

[[emne]]
id = "am_bidrag"
kort = ["loen"]
titel = "AM-bidrag"
inventar = ["AM-bidrag"]
registerposter = ["skat.am_bidrag"]
advarsler = []
niveau1 = "Af din løn betaler du først AM-bidrag. Af din pension betaler du det ikke. Det er betalt, da pengene blev sat ind."
niveau2 = "AM-bidraget trækkes af hele lønnen, før den øvrige skat. Pensionsudbetalinger, folkepension og ATP er fri for AM-bidrag."
niveau3 = "Arbejdsmarkedsbidragsloven § 1. Ved arbejdsgiverordninger betales bidraget ved indbetalingen, aldrig ved udbetaling fra pensionsinstitutter."

[[emne]]
id = "kapitalindkomst"
titel = "Kapitalindkomst"
inventar = ["Kapitalindkomst og bundfradrag"]
registerposter = ["skat.kapitalindkomst.*", "pal.sats"]
advarsler = []
niveau1 = "Renter og afkast af din opsparing i banken er kapitalindkomst. Den beskattes. Den kan gøre dit pensionstillæg mindre."
niveau2 = "Afkastet af opsparing uden for pension beskattes med bundskat, kommuneskat og kirkeskat. Kun over et bundfradrag rammes det også af de højere trin. For gifte kan et ubrugt bundfradrag gå til den anden."
niveau3 = "Personskatteloven § 4 (kapitalindkomst), § 7, stk. 1 og 5 (bundfradrag og overførsel mellem ægtefæller) og § 19, stk. 2 (skatteloft for kapitalindkomst). Renten er pensionens afkast før PAL-skat."

[[emne]]
id = "opsparing"
titel = "Opsparing uden for pension"
inventar = ["Opsparing uden for pension"]
registerposter = []
advarsler = ["OPSPARING_FOER_UDBETALING"]
niveau1 = "Din opsparing kan bruges i det faste beløb. Den kan også stå urørt og vokse. Den tæller med i formuegrænsen for ældrechecken."
niveau2 = "Opsparing, du bruger, lægges i bufferen fra din første udbetaling eller fra du stopper med at arbejde. Urørt opsparing vokser med afkastet, og skatten af afkastet betales af det faste beløb. Det, der står tilbage ved planens slutning, er din restformue."
niveau3 = "Afkastet er positiv kapitalindkomst (PSL § 4) og indgår i indtægtsgrundlaget (lov om social pension § 29). Saldoen pr. 1. januar indgår i den likvide formue (§ 72 d, stk. 2)."

[[emne]]
id = "aktier"
titel = "Frit depot og aktiesparekonto"
inventar = ["Frit depot og aktiesparekonto"]
registerposter = ["skat.aktieindkomst.*", "ask.*"]
advarsler = ["AKTIEINDKOMST_OVER_GRAENSE", "ASK_OVER_LOFT"]
niveau1 = "Aktier i et frit depot giver skat, når du sælger. En aktiesparekonto giver skat hvert år. Vi bruger først banken, så depotet og til sidst kontoen."
niveau2 = "Når du sælger aktier, er gevinsten aktieindkomst. Den har sin egen skat med en lav og en høj sats. Gevinsten tæller med i dit pensionstillæg. Afkastet på en aktiesparekonto giver skat hvert år, men tæller ikke med i pensionstillægget. Begge dele tæller med i formuegrænsen for ældrechecken. Sælger du meget på et år, siger vi det."
niveau3 = "Personskatteloven § 8 a om aktieindkomst og progressionsgrænsen. Ægtefæller kan overføre en uudnyttet grænse (stk. 4). Aktiesparekontoloven om lagerskat og indskudsloft. Lov om social pension § 29 om aktieindkomst i indtægtsgrundlaget og § 72 d, stk. 2, om likvid formue. Hele afkastet i depotet er regnet som kursgevinst. Udbytte er ikke med. Alle typer har samme afkast."

[[emne]]
id = "naeste_krone"
titel = "Hvor skal næste krone hen?"
inventar = ["Hvor skal næste krone hen?"]
registerposter = []
advarsler = []
niveau1 = "Vi prøver at lægge et ekstra beløb fra din løn i ratepension, aldersopsparing, aktiesparekonto eller banken. Du ser, hvad hver vej giver dig om måneden senere."
niveau2 = "Ratepensionen giver fradrag nu, men den beskattes og kan gøre dit pensionstillæg mindre senere. De andre veje giver ikke fradrag. Derfor får de det, ratepensionen koster efter skat. Så er din løn efter skat den samme. Har du en lille pension, kan fradraget nu koste mere senere. Det kalder vi ratepensionsfælden."
niveau3 = "Hvert alternativ er en fuld beregning. Ratepensionen fradrages i den personlige indkomst (personskatteloven § 3) inden for loftet (pensionsbeskatningsloven § 18). Aldersopsparing har sit eget loft (§ 16) og indgår ikke i indtægtsgrundlaget (lov om social pension § 29). Målet er det faste beløb i gennemsnit fra stopalderen, fordi udjævningen ikke låner af senere år."

[[emne]]
id = "loen"
kort = ["loen"]
titel = "Løn, stopalder og fradrag"
inventar = ["Løn, stopalder og fradrag"]
registerposter = ["skat.beskaeftigelsesfradrag.*", "skat.jobfradrag.*", "skat.seniorfradrag.*"]
advarsler = ["INDKOMSTHUL"]
niveau1 = "Skriver du din løn, regner vi årene, til du stopper. Det faste beløb begynder, når du stopper. Du kan se, hvornår du kan stoppe. Ved det faste beløb står din løn efter skat, så du kan sammenligne."
niveau2 = "Af lønnen trækkes AM-bidrag og din pensionsindbetaling. Skriver du din løn som på lønsedlen, regner vi selv indbetalingen ud fra procenterne. Firmaets del er ikke en del af din løn. Beskæftigelsesfradrag, jobfradrag og seniorfradrag gør skatten lidt mindre. Din løn nedsætter ikke dit pensionstillæg, men over et bundfradrag kan den nedsætte ældrechecken. Har du ingen indkomst, fra du stopper, til din første udbetaling, siger vi det."
niveau3 = "Ligningsloven § 9 J (beskæftigelsesfradrag og ekstra fradrag til seniorer de to sidste år før folkepensionsalderen, gældende lov) og § 9 K (jobfradrag). Fradragene nedsætter den skattepligtige indkomst. Lønnen og pensionsindbetalingen reguleres med satsreguleringen. L 117 (2023) om arbejdsindkomst og pensionstillæg."

[[emne]]
id = "usikkerhed"
visninger = ["usikkerhed"]
titel = "Usikkerhed og levetid"
inventar = ["Usikkerhed og levetid"]
registerposter = []
advarsler = []
niveau1 = "Ingen kender fremtiden. Vi viser, hvad dit beløb bliver, hvis afkastet eller prisstigningerne bliver anderledes. Vi viser også, hvad der sker, hvis du lever kortere eller længere, og hvis de første år som pensionist bliver dårlige."
niveau2 = "Hvert scenarie er en hel ny beregning med et andet afkast, en anden inflation eller en anden slutning på planen. Din livrente ændres ikke af levetiden, fordi selskabet betaler den, så længe du lever. Kommer de dårlige år først, tager du penge ud, mens opsparingen er faldet. Så bliver beløbet lavere, selv om afkastet i snit er det samme."
niveau3 = "Afkast ± et procentpoint og inflation ± et halvt procentpoint omkring dit valg, hver for sig og sammen; ingen sats under nul. Planens slutning ændres uden at ændre livrentens beregningshorisont. Dårlige år først (023a): de to første år fra første udbetaling (stopalderen med løn) får dit afkast minus to standardafvigelser efter PAL-skat, Gode år først plus. Standardafvigelsen er godt otte procent for halvt globale aktier og halvt stats- og realkreditobligationer (Rådet for Afkastforventninger, 2. halvår 2026, et til ti år, ingen korrelation). Efter PAL-skat ligger de dårlige år cirka fjorten procentpoint under dit valg. Ratepension, opsparing og buffer følger årets afkast; livrenten gør ikke (forenkling)."

[[emne]]
id = "optimering"
titel = "Find bedste plan"
inventar = ["Optimering"]
registerposter = []
advarsler = []
niveau1 = "Vi prøver mange måder at tage dine pensioner ud på. Vi foreslår den, der giver det højeste faste beløb. Du bestemmer selv, om du vil bruge forslaget."
niveau2 = "Vi flytter, hvornår og hvor længe dine ordninger udbetales, og om folkepensionen skal udskydes. Et forslag må ikke give nye huller i din indkomst. Vi viser, hvor mange kombinationer vi har prøvet."
niveau3 = "Deterministisk koordinatsøgning over startalder, periode, udbetalingsform og opsættelse inden for lovens grænser og et fast budget af beregninger. Målet er det laveste faste beløb i perioden; uafgjort afgøres af det senere niveau."

[[emne]]
id = "husstand"
titel = "Husstand og partner"
inventar = ["Husstand og partner"]
registerposter = []
advarsler = []
niveau1 = "Har du en partner, regner vi jer hver for sig. Men loven kobler jer nogle steder. Fanen Samlet viser jer begge."
niveau2 = "Hver af jer har jeres egen skat og jeres eget faste beløb. Jeres indkomst tæller sammen i pensionstillægget, og jeres formue tæller sammen i ældrechecken. Er I gift, kan et ubrugt personfradrag gå til den anden."
niveau3 = "Lov om social pension § 29 og § 32 a (indtægtsgrundlag for par), § 72 d, stk. 2 (fælles formue), personskatteloven § 10, stk. 3 og § 7, stk. 5 (overførsler mellem ægtefæller). Koblingen løses ved fastpunkt-iteration mellem de to beregninger."

[[emne]]
id = "antagelser"
titel = "Afkast, inflation og dagens kroner"
inventar = ["Afkast, inflation, satsregulering og realfaktor"]
registerposter = []
advarsler = []
niveau1 = "Vi antager et afkast og en prisstigning. Du kan ændre dem. Alle beløb vises i dagens kroner, så de kan sammenlignes."
niveau2 = "Et beløb om tyve år er mindre værd end i dag. Vi regner det om med den antagne inflation. Satser i loven stiger med inflationen. Afkastet er efter skat på pensionen."
niveau3 = "Realfaktor = 1 / (1 + inflation) opløftet i antal år fra i dag. Satsreguleringen følger inflationen, medmindre andet er valgt. Afkastet er efter PAL-skat; bufferens rente er afkastet før PAL-skat."

[[emne]]
id = "fastpunkt"
titel = "Når tallene påvirker hinanden"
inventar = ["Fastpunkt-iterationer"]
registerposter = []
advarsler = ["BUFFER_IKKE_KONVERGERET"]
niveau1 = "Din opsparing giver renter. Renterne påvirker skat og tillæg. Det påvirker igen, hvor meget du kan spare op. Vi regner det igennem flere gange, til tallet ligger fast."
niveau2 = "Vi regner årene, finder det faste beløb og opsparingen, og regner så årene igen med opsparingens renter og formue. Vi stopper, når beløbet ikke ændrer sig mærkbart. Lykkes det ikke, siger vi det."
niveau3 = "Deterministisk fastpunkt-iteration med fast loft over antal runder; stop, når det jævne beløb ændrer sig mindre end tolerancen i alle år, eller ingen år krydser formuegrænsen. For et par itereres også mellem de to personer."

[[emne]]
id = "afrunding"
titel = "Afrunding"
inventar = ["Afrunding og præcision"]
registerposter = []
advarsler = []
niveau1 = "Vi runder det faste beløb af til hele hundrede kroner. Det er et overslag, ikke et præcist tal."
niveau2 = "Beregningen sker med fuld præcision. Kun det, vi viser, er afrundet. Små forskelle i summer skyldes afrunding."
niveau3 = "Hovedtallet afrundes til nærmeste hundrede kroner; tabeller til hele kroner. Optimeringen sammenligner afrundede beløb, så forslag ikke afhænger af regnestøj."

[[emne]]
id = "pdf"
titel = "Din rapport fra PensionsInfo"
inventar = ["PDF-aflæsning"]
registerposter = []
advarsler = []
niveau1 = "Vi læser din rapport fra PensionsInfo her i din browser. Den sendes ikke nogen steder hen. Tjek altid tallene bagefter."
niveau2 = "Vi læser ordninger, saldo, udbetalingsalder og ATP. Forsikringer og omkostninger læses ikke. Kan vi ikke læse noget sikkert, beder vi dig skrive det."
niveau3 = "Lokal, regelbaseret aflæsning uden kunstig intelligens (forfatningens princip XI). Intet skrives til disk eller logs."

# ── Sådan læser du … (feature 020b) ──────────────────────────────────────────

[[emne]]
id = "laes_hovedtal"
titel = "Sådan læser du tallet øverst"
visninger = ["hovedtal"]
inventar = ["Præsentation: hovedtal, kort, graf, tidslinje, opsparingsgraf, faner, statusikoner og farver"]
registerposter = []
advarsler = []
niveau1 = "Tallet øverst er det, du kan bruge hver måned. Det er efter skat. Det er i dagens kroner. Under tallet står, hvornår det begynder."
niveau2 = "Tallet er det faste beløb, du kan holde hele perioden, når dine udbetalinger og din opsparing jævnes ud. Stiger det senere, står det under tallet. Pilen viser, hvor meget tallet ændrede sig ved din sidste ændring."
niveau3 = "Det laveste jævne niveau fra udjævningens første år til planens slutning, gange realfaktoren, divideret med tolv og afrundet til hele hundrede kroner. Med løn begynder perioden ved stopalderen."

[[emne]]
id = "laes_graf"
titel = "Sådan læser du grafen"
visninger = ["graf"]
inventar = ["Præsentation: hovedtal, kort, graf, tidslinje, opsparingsgraf, faner, statusikoner og farver"]
registerposter = []
advarsler = []
niveau1 = "Hver søjle er et år. Farverne viser, hvor pengene kommer fra. Den stiplede linje er det faste beløb, du kan bruge. Klik på et år for at se det regnet ud."
niveau2 = "Søjlerne er det, du får udbetalt efter skat om måneden, fordelt på kilder. Over linjen sparer du op; under linjen bruger du af opsparingen. Mærker over søjlerne viser engangsbeløb, og felter bag søjlerne viser år med en advarsel."
niveau3 = "Søjlerne er kildernes netto efter den forholdsmæssige skattefordeling, pr. måned. Linjen er det jævne niveau. Aksen begynder ved den tidligste pensionsalder for ordninger eller din alder i dag, så den ikke hopper, når en ordning flyttes."

[[emne]]
id = "laes_tidslinje"
titel = "Sådan læser du tidslinjen"
visninger = ["tidslinje"]
inventar = ["Præsentation: hovedtal, kort, graf, tidslinje, opsparingsgraf, faner, statusikoner og farver"]
registerposter = []
advarsler = []
niveau1 = "Hver bjælke er en ordning. Den viser, hvornår pengene kommer. Træk i bjælken for at flytte den. Vi regner forfra med det samme."
niveau2 = "Bjælkens start er det år, udbetalingen begynder. Dens længde er antal år for en ratepension eller portioner. Klik på en bjælke for at justere år for år med knapper. Du kan ikke flytte en ordning til før den tidligste lovlige alder."
niveau3 = "Grænserne kommer fra kernens regler: pensionsudbetalingsalderen, ratepensionens mindste og længste periode, fristen for kapitalpension og den længste opsættelse af folkepensionen."

[[emne]]
id = "laes_opsparingsgraf"
titel = "Sådan læser du opsparingsgrafen"
visninger = ["opsparingsgraf"]
inventar = ["Præsentation: hovedtal, kort, graf, tidslinje, opsparingsgraf, faner, statusikoner og farver"]
registerposter = []
advarsler = []
niveau1 = "Grafen viser din opsparing, der bruges til det faste beløb. Den går aldrig i minus. Ved planens slutning er den brugt op."
niveau2 = "Opsparingen vokser, når du får mere, end du bruger, og når et engangsbeløb lander. Den falder, når du bruger af den. Den er i dagens kroner ved årets udgang."
niveau3 = "Bufferens restværdi ved årets udgang gange realfaktoren. Beløb under en krone vises som nul (regnestøj)."

[[emne]]
id = "laes_faner"
titel = "Sådan læser du fanerne"
visninger = ["faner"]
inventar = ["Præsentation: hovedtal, kort, graf, tidslinje, opsparingsgraf, faner, statusikoner og farver"]
registerposter = []
advarsler = []
niveau1 = "Fanen Dig viser dig. Fanen Partner viser din partner. Fanen Samlet viser jer begge lagt sammen."
niveau2 = "I hver fane kan du flytte den persons ordninger. Under Samlet er tallene summen af jeres faste beløb pr. kalenderår. Jeres pensionstillæg og ældrecheck er regnet sammen, som loven siger."
niveau3 = "Hver person har sin egen fremskrivning og udjævning. Koblingerne (indtægtsgrundlag, formue og overførsler mellem ægtefæller) løses ved fastpunkt-iteration mellem de to."

[[emne]]
id = "laes_statusikoner"
titel = "Sådan læser du ikonerne"
visninger = ["statusikoner"]
inventar = ["Præsentation: hovedtal, kort, graf, tidslinje, opsparingsgraf, faner, statusikoner og farver"]
registerposter = []
advarsler = []
niveau1 = "Ikonet ✓ betyder, at vi har tjekket det i loven. Ikonet ≈ er et gæt om fremtiden. Ikonet ! betyder, at du skal se efter."
niveau2 = "Hvert ikon har også en tekst, så du ikke skal gætte ud fra farven. Forenklinger står under \"Se vores forenklinger\", og dem, der påvirker dit tal, står øverst."
niveau3 = "Status fra regelregistret: verificeret, sekundær kilde eller uverificeret. Antagelser er brugerens eller standardværdier. Advarsler kommer fra kernen med kode og aldre."

[[emne]]
id = "laes_beloeb"
titel = "Dagens kroner og årets kroner"
visninger = ["beloeb"]
inventar = ["Nominelle beløb og dagens kroner, måned og år, alder og kalenderår"]
registerposter = []
advarsler = []
niveau1 = "Om tyve år er en krone mindre værd end i dag. I dagens kroner kan du sammenligne beløbene. I årets kroner ser du det beløb, der står på kontoen det år."
niveau2 = "Dagens kroner er årets kroner regnet om med den antagne inflation. Tallet øverst er altid i dagens kroner. Grafen, kortene og tabellerne kan vise begge dele. Alder er din alder i året, og beløb pr. måned er årets beløb delt med tolv."
niveau3 = "Beløb i dagens kroner = årets kroner gange realfaktoren 1 / (1 + inflation) opløftet i antal år fra i dag. Valget huskes kun i denne browser."

[[emne]]
id = "forbehold"
titel = "Information, ikke rådgivning"
inventar = ["Forbehold: information, ikke rådgivning"]
registerposter = []
advarsler = []
niveau1 = "Tallene er et overslag. De er ikke et råd. Tal med en rådgiver, før du beslutter noget."
niveau2 = "Beregningen bygger på dine svar, reglerne i år og antagelser om fremtiden, som ingen kender. Forslag fra Find bedste plan er eksempler, ikke anbefalinger."
niveau3 = "Information efter gældende regler og registrets satser. Forenklinger og antagelser står i registrene og under Sådan har vi regnet. Kontakt en certificeret pensionsrådgiver ved konkrete beslutninger."

# ── Ordliste (feature 020b, FR-009) ──────────────────────────────────────────

[[ord]]
ord = "Indtægtsgrundlag"
niveau1 = "Din anden indkomst ud over folkepensionen. Den bruges til at regne pensionstillægget."
niveau2 = "Private pensioner, ATP og kapitalindkomst lagt sammen. Din egen løn tæller ikke med. Er du gift eller samlevende, tæller jeres samlede indkomst."
niveau3 = "Lov om social pension § 29. Partnerens indkomst indgår delvist, når partneren ikke er pensionist (§ 32 a)."

[[ord]]
ord = "Modregning"
niveau1 = "Når pensionstillægget bliver mindre, fordi du har anden indkomst."
niveau2 = "Over et fradrag trækkes en procentdel af indtægtsgrundlaget fra tillægget, til det er nul."
niveau3 = "Aftrapningen i lov om social pension § 30 og § 32 med registrets fradrag og procentsats."

[[ord]]
ord = "Personlig tillægsprocent"
niveau1 = "Et tal fra nul til hundrede. Det styrer, hvor meget du får i ældrecheck og mediecheck."
niveau2 = "Den er hundrede ved lav indkomst og falder et point for hvert trin over grænsen."
niveau3 = "Lov om social pension § 14 e. Egen arbejdsindkomst indgår over et bundfradrag."

[[ord]]
ord = "Likvid formue"
niveau1 = "Penge, du hurtigt kan bruge. Fx penge i banken og aktier."
niveau2 = "Bank, obligationer, aktier, investeringsbeviser og aktiesparekonto. Din bolig og din pension tæller ikke med."
niveau3 = "Lov om social pension § 72 d, stk. 2. Opgøres pr. 1. januar for husstanden samlet."

[[ord]]
ord = "Personfradrag"
niveau1 = "Den del af din indkomst, du ikke betaler skat af."
niveau2 = "Et fast beløb om året, som trækkes fra, før bundskat og kommuneskat regnes. Bruger du det ikke selv, kan din ægtefælle bruge resten."
niveau3 = "Personskatteloven § 10. Værdien regnes pr. skattegrundlag; uudnyttet skatteværdi overføres til ægtefællen efter § 10, stk. 3."

[[ord]]
ord = "Personlig indkomst"
niveau1 = "Din indkomst fra løn og pension, før skat."
niveau2 = "Løn efter AM-bidrag og pensionsindbetaling, pensionsudbetalinger, folkepension og ATP."
niveau3 = "Personskatteloven § 3. Grundlag for bundskat, mellemskat og topskat."

[[ord]]
ord = "Kapitalindkomst"
niveau1 = "Renter og afkast af penge, du har sparet op uden for pension."
niveau2 = "Positiv kapitalindkomst beskattes og tæller med i pensionstillæggets indtægtsgrundlag."
niveau3 = "Personskatteloven § 4. Bundfradrag og skatteloft efter § 7, stk. 1, og § 19, stk. 2."

[[ord]]
ord = "Skattepligtig indkomst"
niveau1 = "Det tal, din skat til kommunen regnes af. Fradrag trækkes fra først."
niveau2 = "Personlig indkomst og kapitalindkomst minus fradrag som beskæftigelsesfradrag."
niveau3 = "Personskatteloven § 1. Grundlag for kommune- og kirkeskat."

[[ord]]
ord = "Ligningsmæssige fradrag"
niveau1 = "Fradrag, der gør din skat til kommunen mindre. Du får dem, når du har et job."
niveau2 = "Beskæftigelsesfradrag, jobfradrag og seniorfradrag. De trækkes kun fra i kommuneskatten og kirkeskatten."
niveau3 = "Ligningsloven § 9 J og § 9 K. Fradrages i den skattepligtige indkomst."

[[ord]]
ord = "AM-bidrag"
niveau1 = "En skat af din løn. Den trækkes først."
niveau2 = "Arbejdsmarkedsbidraget er en procent af lønnen. Pensionsudbetalinger er fri for det."
niveau3 = "Arbejdsmarkedsbidragsloven § 1."

[[ord]]
ord = "PAL-skat"
niveau1 = "Skat af det, din pension tjener. Den betales af dit selskab, ikke af dig."
niveau2 = "Afkastet, du skriver, er efter PAL-skat. Opsparing uden for pension regnes med afkastet før PAL-skat."
niveau3 = "Pensionsafkastbeskatningsloven. Satsen står i registret."

[[ord]]
ord = "Dagens kroner"
niveau1 = "Beløb regnet om, så de er lige meget værd som penge i dag."
niveau2 = "Vi regner fremtidige beløb om med den antagne inflation. Så kan du sammenligne år med hinanden."
niveau3 = "Realfaktor = 1 / (1 + inflation) opløftet i antal år fra i dag."

[[ord]]
ord = "Satsregulering"
niveau1 = "Satserne i loven stiger hvert år. Fx folkepensionen."
niveau2 = "Vi lader satserne stige med inflationen, medmindre andet er valgt."
niveau3 = "Lov om en satsreguleringsprocent. Bruges for alle registerposter markeret som regulerede."

[[ord]]
ord = "Folkepensionsalder"
niveau1 = "Den alder, hvor du kan få folkepension."
niveau2 = "Den afhænger af, hvornår du er født, og står i loven."
niveau3 = "Lov om social pension § 1 a."

[[ord]]
ord = "Pensionsudbetalingsalder"
niveau1 = "Den alder, hvor du kan få din egen pension ud. Den er før folkepension."
niveau2 = "Den ligger nogle år før folkepensionsalderen og afhænger af, hvornår ordningen er oprettet."
niveau3 = "Pensionsbeskatningsloven § 1 A."

[[ord]]
ord = "Buffer"
niveau1 = "Din opsparing, der bruges til at holde det faste beløb."
niveau2 = "Engangsbeløb og overskud fra gode år lægges i bufferen og bruges i år med mindre."
niveau3 = "Bufferen forrentes med afkastet før PAL-skat, og afkastet beskattes som kapitalindkomst. Den er aldrig negativ."

[[ord]]
ord = "Restformue"
niveau1 = "De penge, der er tilbage, når planen slutter."
niveau2 = "Opsparing, du bruger i det faste beløb, er brugt op. Urørt opsparing står tilbage."
niveau3 = "Summen af aktiverne ved udgangen af planens sidste år i dagens kroner."

[[ord]]
ord = "Skatteloft"
niveau1 = "En grænse for, hvor høj din skat kan blive."
niveau2 = "Bliver den samlede skattesats for høj, nedsættes de højeste skattetrin."
niveau3 = "Personskatteloven § 19 (det skrå skatteloft), særskilt for kapitalindkomst."
