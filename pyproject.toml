[project]
name = "pensionskerne"
version = "0.1.0"
description = "Deterministisk beregningskerne for dansk pensionsplanlægning"
requires-python = ">=3.11"
dependencies = []

[tool.uv]
default-groups = ["dev", "app"]

[dependency-groups]
app = [
    "anthropic>=0.70",
    "fastapi>=0.115",
    "pdfplumber>=0.11",
    "uvicorn>=0.30",
]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pensionskerne", "src/pensionsoverblik"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
