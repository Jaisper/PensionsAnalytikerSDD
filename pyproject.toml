[project]
name = "pensionskerne"
version = "0.1.0"
description = "Deterministisk beregningskerne for dansk pensionsplanlægning"
requires-python = ">=3.11"
dependencies = []

[tool.uv]
default-groups = ["dev", "app"]

[dependency-groups]
app = [
    "pdfplumber>=0.11",
]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "playwright>=1.64.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pensionskerne", "src/pensionsoverblik"]
exclude = ["src/pensionsoverblik/static"]  # brugerfladen ligger i _site/, ikke i wheel'et

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not browser'"
markers = ["browser: kører den byggede side i en browser (uv run pytest -m browser)"]
pythonpath = ["."]
