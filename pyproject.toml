[project]
name = "pensionskerne"
version = "0.1.0"
description = "Deterministisk beregningskerne for dansk pensionsplanlægning"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pensionskerne"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
